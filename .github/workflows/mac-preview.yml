name: Build macOS preview
on:
  workflow_dispatch:
  push:
    branches: [main, mac-preview]
    paths: ['macos/**', '.github/workflows/mac-preview.yml']
permissions:
  contents: read
concurrency:
  group: mac-preview
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: |
          arch=$(python -c 'import platform; print(platform.machine())')
          python -m pip download --only-binary=:all: --platform "macosx_13_0_${arch}" --dest ventura-wheels -r macos/requirements-mac.txt
          python -m pip install --no-index --find-links ventura-wheels -r macos/requirements-mac.txt
      - name: Test counters and capture boundaries
        run: python -m unittest discover -s macos -p "test_*.py" -v
      - name: Check native capture APIs
        run: |
          python - <<'PY'
          import ScreenCaptureKit as SC, Quartz
          assert hasattr(SC.SCScreenshotManager, 'captureImageWithFilter_configuration_completionHandler_')
          assert hasattr(SC.SCContentFilter, 'contentRect')
          assert hasattr(SC.SCContentFilter, 'pointPixelScale')
          assert hasattr(SC.SCStreamConfiguration, 'setIgnoreShadowsSingleWindow_')
          assert callable(Quartz.CGPreflightScreenCaptureAccess)
          print('Native capture API bindings available')
          PY
      - name: Build app and verify ad-hoc signature
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: python macos/build_mac.py
      - name: Launch packaged app smoke test
        env:
          MMC_TEST_DATA: ${{ runner.temp }}/mmc-smoke
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(['macos/dist/MapleMeterChecker.app/Contents/MacOS/MapleMeterChecker', '--smoke-test'], capture_output=True, text=True, timeout=90)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode == 0, result.returncode
          assert 'MAC_APP_SMOKE_OK' in result.stdout
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mac-preview-${{ runner.arch }}
          path: macos/release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish mac-only preview without replacing Windows latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=mac-v2.2.0-preview.3
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* macos/README-mac.txt --clobber
          else
            gh release create "$tag" release-files/* macos/README-mac.txt --target "$GITHUB_SHA" --prerelease --latest=false --title "Mac 테스트 버전 2.2.0-preview.3" --notes-file macos/RELEASE-NOTES.txt
          fi
